name: Deploy Supabase Edge Functions

# Despliega las edge functions solas en cada merge a main que las toque.
# Una sola cosa manual, una única vez: cargar el secret SUPABASE_ACCESS_TOKEN
# en GitHub (Settings → Secrets and variables → Actions). Después, cero toque.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aydtxqhtkcyytsamervs
    steps:
      - uses: actions/checkout@v4

      - name: Instalar la CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar la function del webhook
        # verify_jwt=false lo toma de supabase/config.toml (lo llama Lemon
        # Squeezy, no el navegador; la seguridad la da la firma HMAC).
        run: supabase functions deploy lemonsqueezy-webhook --project-ref "$PROJECT_REF"
