<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- tablero privado: fuera de los buscadores, y sin regalar la URL al navegar afuera -->
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="marca/favicon-azul.png">
<title>Narra ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   narraglobal · Narra ID · plantilla del tablero
   Layout «Lo que funcionó» · 10-09-2026
   Todo lo que se ve sale de datos.js. Este archivo no se toca para emitir.
   Todas las clases van con prefijo .ni- para no pisar el host del monorepo.
   ═══════════════════════════════════════════════════════════════════ */
.ni{
  --ni-blue:#3E1CFF; --ni-blue-soft:#ece9ff; --ni-blue-ink:#2c0fd6;
  --ni-pink:#FF3D7A; --ni-pink-soft:#fff0f5; --ni-pink-ink:#c9265b;
  --ni-green:#00C281; --ni-green-ink:#00875a; --ni-green-soft:#eafaf4;
  --ni-ink:#111319; --ni-ink-soft:#565a64; --ni-mute:#6f7480;
  --ni-paper:#fff; --ni-paper-2:#f7f8fa; --ni-line:#e8e9ed; --ni-line-2:#d9dbe0; --ni-grid:#f0f1f4;
  --ni-lineas-titular:2; --ni-lineas-copy:2; --ni-viz-alto:104px;
  --ni-serif:Fraunces,Georgia,serif; --ni-sans:Inter,system-ui,-apple-system,sans-serif;
  --ni-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  font-family:var(--ni-sans);color:var(--ni-ink);background:var(--ni-paper);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
.ni *,.ni *::before,.ni *::after{box-sizing:border-box;margin:0;padding:0}
.ni a{color:inherit}
.ni button{font:inherit;color:inherit}
.ni .ni-inner{max-width:1080px;margin:0 auto;padding:0 24px}
.ni .ni-k{font-family:var(--ni-mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ni-mute)}
.ni h1,.ni h2,.ni h3,.ni h4{font-family:var(--ni-serif);font-weight:500;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.ni h1{font-size:clamp(30px,4vw,44px)}
.ni h2{font-size:clamp(24px,3vw,32px)}
.ni [hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.ni *{animation:none!important;transition:none!important}}

/* ── nota de emisión (sólo si datos.js trae meta.nota) ── */
.ni .ni-demo{background:var(--ni-pink-soft);border-bottom:1px solid var(--ni-line);padding:9px 0}
.ni .ni-demo .ni-inner{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ni .ni-demo b.ni-tag{font-family:var(--ni-mono);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ni-pink-ink);border:1px solid var(--ni-pink-ink);padding:3px 7px;border-radius:4px;flex:none;margin-top:1px}
.ni .ni-demo span{font-size:12px;color:var(--ni-ink-soft);line-height:1.5}
.ni .ni-demo span b{color:var(--ni-ink);font-weight:600}

/* ── barra superior ── */
.ni .ni-top{border-bottom:1px solid var(--ni-line);background:var(--ni-paper-2);position:sticky;top:0;z-index:40}
.ni .ni-top .ni-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:60px}
/* el wordmark tiene el ojo más abajo que su caja: el rótulo se corrige 1px para que lean parejos */
.ni .ni-marca{display:flex;align-items:center;gap:14px;min-width:0}
.ni .ni-marca .ni-k{line-height:1;position:relative;top:1px}
.ni .ni-wm{display:inline-flex;align-items:center;color:#2A4CC4;height:22px}
.ni .ni-wm svg{height:22px;width:auto;aspect-ratio:409/100;display:block;flex:none}
.ni .ni-menu{justify-self:center;display:flex;gap:3px;background:var(--ni-paper);border:1px solid var(--ni-blue);border-radius:10px;padding:3px;flex-wrap:wrap}
.ni .ni-menu a{font-family:var(--ni-mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ni-ink-soft);text-decoration:none;padding:7px 11px;border-radius:6px;white-space:nowrap;transition:.15s}
.ni .ni-menu a:hover{background:var(--ni-blue-soft);color:var(--ni-blue)}
.ni .ni-menu a.on{background:var(--ni-blue-soft);color:var(--ni-blue);box-shadow:inset 0 0 0 1px var(--ni-blue)}
.ni .ni-menu a:focus-visible{outline:2px solid var(--ni-blue);outline-offset:2px}
.ni .ni-who{justify-self:end;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ni-ink-soft)}
@media(max-width:860px){.ni .ni-top .ni-inner{grid-template-columns:1fr auto;height:auto;padding-top:10px;padding-bottom:10px;row-gap:10px}.ni .ni-menu{grid-column:1/-1;justify-self:stretch}.ni .ni-menu a{flex:1;text-align:center}}
.ni section[id]{scroll-margin-top:74px}

/* ── avatar ── */
.ni .ni-av{border-radius:50%;background:var(--h,var(--ni-ink-soft));color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;width:var(--s,30px);height:var(--s,30px);font-size:calc(var(--s,30px)*.34)}
.ni .ni-av img{width:100%;height:100%;object-fit:cover;display:block}
.ni .ni-av.you{box-shadow:0 0 0 2px var(--ni-blue)}

/* ── titulares con la flecha ── */
/* 15-09 · el rótulo de semana alinea por BASELINE con el título, no por el borde de la caja */
.ni .ni-hero{padding:52px 0 26px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ni .ni-sech{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.ni .ni-tog{background:none;border:0;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit;line-height:0;vertical-align:baseline}
.ni .ni-tog .ni-tic{transition:opacity .25s ease}.ni .ni-tog.plegado .ni-tic{opacity:.45}   /* siempre apunta arriba; plegado se atenúa */
.ni .ni-tog:focus-visible{outline:2px solid var(--ni-blue);outline-offset:3px;border-radius:4px}
.ni h1 .ni-tic,.ni h2 .ni-tic{width:.6em;height:.78em;stroke:var(--ni-green-ink);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-.06em;margin-right:.28em}
.ni .ni-fic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
@keyframes niSube{0%,55%,100%{opacity:.25;transform:translateY(1px)}22%{opacity:1;transform:translateY(-1px)}}
@keyframes niBaja{0%,55%,100%{opacity:.25;transform:translateY(-1px)}22%{opacity:1;transform:translateY(1px)}}
.ni .ni-lat path:nth-child(1){animation:niSube 1.9s ease-in-out infinite}
.ni .ni-lat path:nth-child(2){animation:niSube 1.9s ease-in-out .3s infinite}
.ni .ni-lat.dn path:nth-child(1){animation:niBaja 1.9s ease-in-out infinite}
.ni .ni-lat.dn path:nth-child(2){animation:niBaja 1.9s ease-in-out .3s infinite}

/* ── retícula de cards (las dos franjas usan la misma) ── */
.ni .ni-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px;align-items:stretch}
@media(max-width:860px){.ni .ni-grid{grid-template-columns:1fr;grid-template-rows:none;gap:10px}}
.ni .ni-col{display:flex;flex-direction:column;min-width:0}
@supports not (grid-template-rows:subgrid){.ni .ni-col{display:flex;flex-direction:column}}
@media(max-width:860px){.ni .ni-col{display:flex;flex-direction:column;grid-row:auto}}
.ni .ni-grid>.ni-col+.ni-col{margin-top:0}
.ni .ni-det:empty{display:none}
/* la card ocupa toda la columna: las tres terminan a la misma altura */
.ni .ni-card{flex:1 1 auto;position:relative;overflow:hidden;background:var(--ni-paper);border:1px solid var(--ni-line-2);border-radius:12px;padding:11px 12px 0;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto}
.ni .ni-card>*{position:relative;z-index:1}
.ni .ni-krow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ni .ni-krow .ni-k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ni .ni-sem{font-family:var(--ni-mono);font-size:8.5px;letter-spacing:1.1px;color:var(--ni-mute);flex:none;font-variant-numeric:tabular-nums}
.ni .ni-est{display:flex;align-items:center;gap:6px;font-family:var(--ni-mono);font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--ni-green-ink);margin-top:3px}
.ni .ni-est.no{color:var(--ni-mute)}
/* 15-09: «Funcionó» en la misma línea que el rótulo de la cancha */
.ni .ni-kline{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
/* la silueta como ícono, a la altura del rótulo */
.ni .ni-geoi{height:13px;width:auto;flex:none;display:block;opacity:.5}
.ni .ni-geoi path{fill:var(--ni-mute)}
.ni .ni-kline .ni-est.enlinea{margin-right:2px}
.ni .ni-est.enlinea{margin-top:0;font-size:9px;letter-spacing:1.1px;flex:none}
.ni .ni-est.enlinea .ni-fic{width:9px;height:12px}
/* 15-09: la gráfica y el copy suben a la cara de la card */
/* 15-09: sin línea separadora — no hay salto de página adentro de la card */
/* mismo aire en las tres: sin margin-top:auto, que era lo que hacía saltos distintos por card */
.ni .ni-cara{margin-top:0;padding-top:6px;display:flex;flex-direction:column;gap:0}
/* las nomenclaturas, abajo del gráfico */
/* las nomenclaturas entran siempre en una línea */
.ni .ni-leg{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:10px;margin-top:3px;min-height:13px;white-space:nowrap;overflow:hidden}
.ni .ni-leg span{display:inline-flex;align-items:center;gap:5px;font-family:var(--ni-mono);font-size:7.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ni-mute);white-space:nowrap;min-width:0}
.ni .ni-leg b{color:var(--ni-ink);font-weight:600;font-size:8.5px}
.ni .ni-leg i{width:7px;height:7px;border-radius:50%;flex:none}
.ni .ni-leg i.az{background:var(--ni-blue)} .ni .ni-leg i.gr{background:var(--ni-green)} .ni .ni-leg i.gs{background:var(--ni-line-2)}
.ni .ni-leg s{text-decoration:none;font-family:var(--ni-mono);font-size:7px;letter-spacing:.85px;text-transform:uppercase;color:var(--ni-mute);opacity:.8}
.ni .ni-cara .ni-txt.az .ni-ya{margin-left:5px;vertical-align:1px}
.ni .ni-cara .ni-velas{margin-bottom:0}
.ni .ni-cara .ni-txt.az{margin-top:5px}
.ni .ni-borde{height:11px}
/* card 1 · la barra de reparto */
.ni .ni-barp{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--ni-paper-2);box-shadow:inset 0 0 0 1px var(--ni-line);margin-top:2px}
.ni .ni-barp i{display:block;height:100%;background:var(--ni-blue)}
.ni .ni-ejes{display:flex;justify-content:space-between;font-family:var(--ni-mono);font-size:7px;letter-spacing:.8px;text-transform:uppercase;color:var(--ni-mute);margin-top:5px}
/* card azul · la secuencia: viñetas blancas encadenadas con flechas, se lee el orden de un vistazo */
.ni .ni-seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.ni .ni-seq span{background:#fff;color:var(--ni-blue);font-size:11px;font-weight:600;letter-spacing:-.1px;padding:7px 10px;border-radius:7px;line-height:1.1;white-space:nowrap}
.ni .ni-seq s{text-decoration:none;color:rgba(255,255,255,.7);font-size:13px;line-height:1;flex:none}
/* el latido de la instrucción: está viva hasta que se ejecuta */
/* el rótulo de la card azul calza el mismo alto que el «Funcionó» de las blancas, para que las cajas de copy arranquen parejas */
.ni .ni-card.azul .ni-krow{margin-top:3px;min-height:15px;align-items:center}
/* el latido va en «Lo que hay que repetir», que además va en negrita */
.ni .ni-card.azul .ni-k.fuerte{font-weight:700;color:#fff;font-size:9.5px}
.ni .ni-beat{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.92);position:relative;flex:none;margin-right:2px}
.ni .ni-beat::after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.7);animation:niAro 2.4s ease-out infinite}
/* 15-09 · armonía: las tres cards de tu semana miden lo mismo en cada renglón */
/* REGLA · todos los titulares viven en la misma cantidad de renglones, fijada arriba */
.ni #ni-semana .ni-tit,.ni #ni-canchas .ni-tit{display:-webkit-box;-webkit-line-clamp:var(--ni-lineas-titular);-webkit-box-orient:vertical;overflow:hidden;min-height:calc(var(--ni-lineas-titular) * 1.16em)}
.ni #ni-semana .ni-tit{font-size:17px}

/* 15-09 · una sola tinta arriba: titular, marca y «Ver pieza» en negro. El destaque es el peso, no el color. */
.ni .ni-cit{color:var(--ni-ink);font-weight:400}
.ni .ni-cl{font-weight:500;color:var(--ni-ink)}
.ni .ni-cl em{font-style:normal;color:var(--ni-ink);font-weight:700}
.ni .ni-est,.ni .ni-est.enlinea{color:var(--ni-green-ink)}
.ni .ni-est.no{color:var(--ni-mute)}
/* «Ver →» pegado al cierre del titular: chiquito, subrayado, en negro */
.ni .ni-vp.fin{display:inline;font-size:8px;letter-spacing:1px;color:var(--ni-ink);opacity:.65;text-decoration:underline;white-space:nowrap;margin:0 0 0 3px;vertical-align:1px}
.ni .ni-vp.fin:hover{opacity:1}
/* REGLA · la caja del gráfico mide siempre lo mismo en las tres cards */
.ni .ni-viz{height:var(--ni-viz-alto);flex:0 0 var(--ni-viz-alto);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.ni .ni-viz .ni-ln{display:flex;justify-content:center;width:100%}
.ni .ni-viz .ni-ln svg{height:auto;width:100%;max-height:var(--ni-viz-alto);display:block}
.ni .ni-viz .ni-velas{height:34px;margin-bottom:0}
/* el copy vive en su propia caja: separa por materia, sin línea divisoria */
.ni .ni-cajita{background:var(--ni-paper-2);border-radius:9px;padding:9px 10px;margin-top:10px}
.ni .ni-card.azul .ni-cajita{background:rgba(255,255,255,.12)}
.ni .ni-cajita .ni-txt.az{margin-top:0}
/* REGLA · todo copy azul ocupa exactamente los renglones fijados, lleno o no */
.ni .ni-cara .ni-txt.az,.ni .ni-pu p{display:-webkit-box;-webkit-line-clamp:var(--ni-lineas-copy);-webkit-box-orient:vertical;overflow:hidden;min-height:calc(var(--ni-lineas-copy) * 1.45em)}
.ni .ni-cara .ni-txt.az{margin-top:8px}
/* los dos accionables, agrupados al pie de la card */
.ni .ni-acc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px}
.ni .ni-acc .ni-vp{align-self:auto;margin-top:0}
.ni .ni-card.azul .ni-txt.az{color:#fff}
/* el filete va como sombra interior: con border-collapse, el fondo de la fila azul tapaba el borde y se veía cortado */
.ni table.ni-mini tr.fuera td{border-top:0;box-shadow:inset 0 1.5px 0 0 var(--ni-ink)}
.ni table.ni-mini tr.salto td{padding:0;background:var(--ni-paper)}
.ni table.ni-mini tr.salto span{display:block;text-align:center;font-family:var(--ni-mono);font-size:7px;letter-spacing:1.1px;color:var(--ni-mute);padding:5px 0}
.ni table.ni-mini tbody tr:last-child td{border-bottom:0}
.ni .ni-card .ni-tw{width:calc(100% + 24px);margin:10px -12px 0}
.ni .ni-card .ni-tw table.ni-mini thead th:first-child{padding-left:12px}
.ni .ni-card .ni-tw table.ni-mini thead th:last-child{padding-right:12px}
.ni .ni-est .ni-fic{width:11px;height:14px;stroke-width:2.1}
.ni .ni-est .ni-chip{margin-left:6px}
.ni .ni-tit{font-family:var(--ni-serif);font-weight:500;font-size:19px;letter-spacing:-.6px;line-height:1.16;color:var(--ni-ink);text-wrap:balance;margin-top:2px}
.ni .ni-tit.mute{color:var(--ni-mute);font-size:16px}
.ni .ni-txt{font-size:12.5px;color:var(--ni-ink-soft);line-height:1.45;margin-top:2px}
.ni .ni-txt b{color:var(--ni-ink);font-weight:600}
.ni .ni-txt.az{color:var(--ni-blue);font-weight:600;font-size:12px}
.ni .ni-vp{font-family:var(--ni-mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ni-blue);text-decoration:none;align-self:flex-start;margin-top:4px;display:inline-block}
.ni .ni-vp:hover,.ni .ni-vp:focus-visible{text-decoration:underline}
.ni .ni-chip{font-family:var(--ni-mono);font-size:7.5px;letter-spacing:1.1px;text-transform:uppercase;padding:3px 6px;border-radius:3px;line-height:1;white-space:nowrap;background:var(--ni-blue-soft);color:var(--ni-blue)}
.ni .ni-chip.ok{background:var(--ni-green-soft);color:var(--ni-green-ink)}
.ni .ni-chip.gris{background:var(--ni-paper-2);color:var(--ni-mute);box-shadow:inset 0 0 0 1px var(--ni-line)}

/* flechitas de los que se movieron */
.ni .ni-movs{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:auto;padding-top:10px;min-height:18px}
.ni .ni-movs+.ni-pie{margin-top:8px}
.ni .ni-mov{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.ni .ni-mov b{font-weight:600;color:var(--ni-ink)}
.ni .ni-mov.up{color:var(--ni-green-ink)} .ni .ni-mov.dn{color:var(--ni-pink-ink)}
.ni .ni-mov .ni-fic{width:8px;height:11px;stroke-width:2.4}
.ni .ni-mov.quieto{color:var(--ni-mute);font-style:italic}

/* el pie: miniatura a la izquierda, la acción a la derecha. Es un botón. */
.ni .ni-pie{display:flex;align-items:center;gap:12px;width:calc(100% + 24px);margin:auto -12px 0;padding:8px 12px 9px;border-top:1px solid var(--ni-line);min-height:46px;background:transparent;border-left:0;border-right:0;border-bottom:0;border-radius:0 0 11px 11px;cursor:pointer;text-align:left}
.ni .ni-pie.estatico{cursor:default}
.ni .ni-pie:hover:not(.estatico){background:var(--ni-paper-2)}
.ni .ni-pie:focus-visible{outline:2px solid var(--ni-blue);outline-offset:-2px}
.ni .ni-velas{display:flex;gap:1.5px;align-items:flex-end;height:26px;flex:none;margin-bottom:7px}
.ni .ni-velas i{width:5px;border-radius:1px 1px 0 0;background:#e2e5ea;display:block;position:relative;height:var(--h,6px)}
.ni .ni-velas i.up{background:var(--ni-green)} .ni .ni-velas i.dn{background:var(--ni-pink)}
.ni .ni-velas i.chico{background:#c5c9d1}
.ni .ni-velas i.yo::before{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--ni-blue)}
.ni .ni-pie .ni-mi{display:block;font-size:12.5px;min-width:0;flex:1 1 auto;line-height:1.4}
.ni .ni-pie .ni-velas+.ni-btn{margin-left:auto}
.ni .ni-pie .ni-velas{flex:1 0 auto}
.ni .ni-pie .ni-mi .az{color:var(--ni-blue);font-weight:600;white-space:nowrap;margin-right:4px}
.ni .ni-pie .ni-mi .ng{font-weight:500;font-size:11.5px;color:var(--ni-ink-soft)}
.ni .ni-btn{margin-left:auto;flex:none;font-family:var(--ni-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ni-ink);background:var(--ni-paper);border:1px solid var(--ni-line-2);border-radius:8px;padding:7px 11px;font-weight:500;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.ni .ni-btn.des::after{content:'';width:5px;height:5px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .18s}
.ni .ni-pie[aria-expanded="true"] .ni-btn.des::after{transform:rotate(-135deg) translateY(-1px)}
.ni .ni-pie:hover .ni-btn,.ni .ni-pie[aria-expanded="true"] .ni-btn{border-color:var(--ni-blue);color:var(--ni-blue);background:var(--ni-blue-soft)}
.ni .ni-ya{flex:none;font-family:var(--ni-mono);font-size:7.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ni-blue);background:var(--ni-blue-soft);border-radius:3px;padding:3px 6px;line-height:1;white-space:nowrap}

/* la card azul: lo que hay que repetir */
.ni .ni-card.azul{background:var(--ni-blue);border-color:var(--ni-blue)}
.ni .ni-card.azul .ni-k,.ni .ni-card.azul .ni-sem{color:rgba(255,255,255,.72)}
.ni .ni-card.azul .ni-tit{color:#fff}
.ni .ni-card.azul .ni-txt{color:rgba(255,255,255,.86)}
.ni .ni-card.azul .ni-txt b{color:#fff}
.ni .ni-card.azul .ni-pie{border-top-color:rgba(255,255,255,.26)}

.ni .ni-card.azul .ni-pie .ni-mi .az{color:#fff}
.ni .ni-card.azul .ni-pie .ni-mi .ng{color:rgba(255,255,255,.7)}
.ni .ni-card.azul .ni-ya{color:#fff;background:rgba(255,255,255,.16)}
.ni .ni-card.azul .ni-btn{color:#fff;background:transparent;border-color:rgba(255,255,255,.4)}
.ni .ni-card.azul .ni-pie:hover .ni-btn,.ni .ni-card.azul .ni-pie[aria-expanded="true"] .ni-btn{color:#fff;background:rgba(255,255,255,.16);border-color:#fff}

/* marca de agua: la silueta de la cancha */
/* marca de agua gris: a la derecha, sobre la columna del botón Ver tabla, centrada en la caja del titular; no baja al pie */
/* 15-09: la silueta queda arriba, sobre la caja del titular. Con la tabla en la cara, centrarla la dejaba en el medio de las filas. */
.ni .ni-geo{position:absolute;right:16px;top:14px;transform:none;height:var(--wh,120px);width:auto;z-index:0;pointer-events:none;opacity:.06}
.ni .ni-geo path{fill:var(--ni-ink)}
.ni .ni-card[data-top="nacional"] .ni-geo{--wh:96px}
.ni .ni-card[data-top="provincial"] .ni-geo{--wh:90px}
.ni .ni-card[data-top="ciudad"] .ni-geo{--wh:72px}
/* la tabla tapa cualquier resto de la silueta */
.ni .ni-card .ni-tw{position:relative;z-index:1;background:var(--ni-paper)}


/* ── el pulso de ocho semanas de la lista (11-09) ── */
.ni .ni-pulso{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px;font-size:11.5px;color:var(--ni-ink-soft);padding-top:7px;line-height:1.35}
.ni .ni-pulso b{color:var(--ni-ink);font-weight:600}
.ni .ni-pulso .ni-sp{color:var(--ni-line-2)}
.ni .ni-movs+.ni-pulso{margin-top:0}
.ni .ni-pulso+.ni-pie{margin-top:8px}
.ni .ni-pulsobox{padding:12px 13px 14px;border-bottom:1px solid var(--ni-line);display:flex;flex-direction:column;gap:8px}
.ni .ni-clima{display:flex;gap:3px;align-items:flex-end;height:34px}
.ni .ni-clima .cw{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0}
.ni .ni-clima .cw i{display:block;border-radius:1px;width:100%}
.ni .ni-clima .cw i.up{background:var(--ni-green)}
.ni .ni-clima .cw i.fl{background:var(--ni-line-2)}
.ni .ni-clima .cw i.dn{background:var(--ni-pink)}
.ni .ni-ejes{display:flex;justify-content:space-between;gap:8px;font-family:var(--ni-mono);font-size:7px;letter-spacing:.9px;text-transform:uppercase;color:var(--ni-mute)}
.ni .ni-hall{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--ni-line);padding-top:9px}
.ni .ni-hall p{font-size:11.5px;color:var(--ni-ink-soft);line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.ni .ni-hall p s{text-decoration:none;font-family:var(--ni-mono);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;flex:none;padding-top:3px;width:64px;color:var(--ni-mute)}
.ni .ni-hall p s.up{color:var(--ni-green-ink)}
.ni .ni-hall p s.nu{color:var(--ni-blue)}
.ni .ni-hall b{color:var(--ni-ink);font-weight:600}

/* ── el desplegable debajo de cada card ── */
.ni .ni-det{border:1px solid var(--ni-line-2);border-top:0;border-radius:0 0 12px 12px;background:var(--ni-paper);margin-top:-2px;overflow:hidden;align-self:start}
.ni .ni-detb{padding:13px 13px 14px;display:flex;flex-direction:column;gap:9px}
.ni .ni-deth{font-family:var(--ni-serif);font-weight:500;font-size:18px;letter-spacing:-.55px;line-height:1.16;color:var(--ni-ink);text-wrap:balance}
.ni .ni-detp{font-size:12px;line-height:1.5;color:var(--ni-ink-soft)}
.ni .ni-detp .ni-ya{display:inline-block;vertical-align:middle;margin-left:6px}
.ni .ni-detb>.ni-txt.az{margin-top:4px}
.ni .ni-detb>.ni-velas{margin-bottom:6px}
.ni .ni-detp b{color:var(--ni-ink);font-weight:600}
.ni .ni-detl{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--ni-line);padding-top:9px}

/* gráfica de ocho semanas, con techo y piso */
.ni .ni-rep1{font-size:16px;line-height:1.35;margin:0 0 10px}.ni .ni-rep1 b{font-size:26px;color:var(--ni-blue);font-weight:800;margin-right:2px}
.ni .ni-sindato{font-family:var(--ni-mono);font-size:10px;letter-spacing:.4px;color:var(--ni-mute);margin:8px 0 0;padding:0 4px}
.ni .ni-ln svg{display:block;overflow:visible;width:100%;height:auto}
.ni .ni-ln .pk{font-family:var(--ni-mono);font-size:8px;letter-spacing:.7px;font-weight:500;text-transform:uppercase;opacity:.85}
.ni .ni-ln .pk.up{fill:var(--ni-green-ink)} .ni .ni-ln .pk.dn{fill:var(--ni-pink-ink)} .ni .ni-ln .pk.az{fill:var(--ni-blue)}
.ni .ni-ln .ax{font-family:var(--ni-mono);font-size:8px;letter-spacing:.8px;fill:var(--ni-mute)}
/* reparto de la gente que se movió */
.ni .ni-rep{display:flex;gap:3px;align-items:stretch;height:40px}
.ni .ni-rp{flex:var(--w) 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 8px;border-radius:6px;overflow:hidden}
.ni .ni-rp b{font-size:14px;font-weight:700;line-height:1}
.ni .ni-rp s{text-decoration:none;font-family:var(--ni-mono);font-size:6.5px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .ni-rp.a{background:var(--ni-blue);color:#fff}
.ni .ni-rp.e{background:var(--ni-blue-soft);color:var(--ni-blue)}
.ni .ni-rp.n{background:var(--ni-paper-2);color:var(--ni-mute);box-shadow:inset 0 0 0 1px var(--ni-line)}

/* ── la tabla chica de cada cancha ── */
.ni .ni-tw{overflow-x:auto}
.ni table.ni-mini{width:100%;border-collapse:collapse;min-width:0}
/* 15-09 · la cabecera entera va en negro: rótulo, titular y encabezado de tabla son un solo bloque */
.ni .ni-cab{background:var(--ni-ink);color:#fff;width:calc(100% + 24px);margin:-11px -12px 0;padding:10px 12px 9px;border-radius:11px 11px 0 0;position:relative;z-index:1}
.ni .ni-blanco{padding:9px 0 10px;position:relative;z-index:1;background:var(--ni-paper)}
.ni .ni-cab .ni-k{color:rgba(255,255,255,.6)}
.ni .ni-cab .ni-sem{color:rgba(255,255,255,.45)}
.ni .ni-cab .ni-geoi{opacity:.75}
.ni .ni-cab .ni-geoi path{fill:#fff}
.ni .ni-card .ni-tw{margin-top:0}
/* cabecera en piedra con filete negro: transición suave entre la card y la tabla */
.ni table.ni-mini thead th{font-family:var(--ni-mono);font-size:6.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ni-ink-soft);font-weight:500;text-align:left;padding:7px 5px;border-bottom:1.5px solid var(--ni-ink);background:#f1f3f7;white-space:nowrap}
.ni table.ni-mini thead th.r{text-align:right}
.ni table.ni-mini tbody td{padding:4px 5px;font-size:11px;color:var(--ni-ink-soft);vertical-align:middle;font-variant-numeric:tabular-nums}
.ni table.ni-mini tbody tr.zeb td{background:var(--ni-paper-2)}
.ni table.ni-mini tbody tr:hover td{background:var(--ni-grid)}
.ni table.ni-mini td.p{font-family:var(--ni-mono);font-size:9px;color:var(--ni-mute);width:16px;padding-left:8px;padding-right:0}
.ni table.ni-mini td.ac{display:flex;align-items:center;gap:8px;min-width:0;padding-left:5px;overflow:visible}
.ni table.ni-mini td.ac .nm{font-size:11px;font-weight:600;color:var(--ni-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni table.ni-mini td.r{text-align:right}
.ni table.ni-mini td.ix{font-weight:600;color:var(--ni-ink);width:26px;font-size:11.5px}
.ni table.ni-mini td.sc{width:34px}
.ni table.ni-mini td.sc .sv{font-family:var(--ni-mono);font-size:9px;font-weight:500;color:var(--ni-ink-soft)}
.ni table.ni-mini td.dd{font-family:var(--ni-mono);font-size:9px;color:var(--ni-ink-soft);width:34px;text-align:right;padding-right:12px}
/* 15-09 · los puestos ganados en verde, los perdidos en rojo */
.ni table.ni-mini td.dd.up{color:var(--ni-green-ink);font-weight:600}
.ni table.ni-mini td.dd.dn{color:var(--ni-pink-ink);font-weight:600}
.ni table.ni-mini td.sem{width:38px;padding-right:9px}
.ni table.ni-mini tr.yo td{background:rgba(62,28,255,.05)}
.ni table.ni-mini tr.yo.zeb td{background:rgba(62,28,255,.08)}
.ni table.ni-mini tr.yo .nm,.ni table.ni-mini tr.yo td.ix,.ni table.ni-mini tr.yo td.p,.ni table.ni-mini tr.yo td.sc .sv{color:var(--ni-blue)}
.ni table.ni-mini tr.corte td{border-bottom:1px solid var(--ni-ink)}
.ni table.ni-mini .ni-av{width:26px!important;height:26px!important;font-size:9px;background:var(--ni-paper-2)!important;color:var(--ni-ink-soft);box-shadow:inset 0 0 0 1px var(--ni-line-2)}
.ni table.ni-mini tr.yo .ni-av{background:var(--ni-blue-soft)!important;color:var(--ni-blue);box-shadow:inset 0 0 0 1px var(--ni-blue)}
.ni .ni-form{display:flex;gap:1px}
.ni .ni-form i{width:3px;height:10px;border-radius:.5px;background:var(--ni-grid);display:block}
.ni .ni-form i.up{background:var(--ni-green)} .ni .ni-form i.dn{background:var(--ni-pink)} .ni .ni-form i.fl{background:var(--ni-line-2)}
/* el play de la pieza destacada */
.ni .ni-play{margin-left:5px;flex:none;width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--ni-blue-soft);box-shadow:inset 0 0 0 1px rgba(62,28,255,.28);border:0;cursor:pointer;position:relative;animation:niLatir 2.2s ease-in-out infinite}
.ni .ni-play svg{width:8px;height:8px;fill:var(--ni-blue)}
.ni .ni-play:hover,.ni .ni-play.on{background:var(--ni-blue);animation:none}
.ni .ni-play:hover svg,.ni .ni-play.on svg{fill:#fff}
.ni .ni-play:focus-visible{outline:2px solid var(--ni-blue);outline-offset:2px}
@keyframes niLatir{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ni table.ni-mini tr.pz td{padding:0;background:var(--ni-paper)!important}
.ni .ni-pzbox{margin:2px 9px 9px;padding:11px 12px 12px;border:1px solid var(--ni-blue);border-radius:9px;background:var(--ni-blue-soft);display:flex;flex-direction:column;gap:5px}
.ni .ni-pzbox .ni-k{color:var(--ni-blue)}
.ni .ni-pzt{font-family:var(--ni-serif);font-weight:500;font-size:15px;letter-spacing:-.5px;line-height:1.2;color:var(--ni-ink);text-wrap:balance;white-space:pre-line}
.ni .ni-vermas{display:block;width:100%;appearance:none;border:0;border-top:1px solid var(--ni-line);background:var(--ni-paper);font-family:var(--ni-mono);font-size:7.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ni-ink-soft);padding:8px;cursor:pointer}
.ni .ni-vermas:hover{background:var(--ni-paper-2);color:var(--ni-ink)}
.ni .ni-vermas:focus-visible{outline:2px solid var(--ni-blue);outline-offset:-2px}

/* ── la franja gris, adentro del ancho ── */
.ni .ni-zona{padding:44px 0 8px}
.ni .ni-zona>.ni-inner{background:var(--ni-paper-2);border:1px solid var(--ni-line);border-radius:20px;padding:26px 26px 30px}
@media(max-width:640px){.ni .ni-zona>.ni-inner{border-radius:14px;padding:20px 16px 24px}}
/* 15-09 · card de cancha en piedra, con la tabla en blanco flotando adentro.
   La piedra es más profunda que el gris de la franja para que la card no se pierda en el fondo. */
.ni .ni-zona .ni-card{background:#eceef3;border-color:#dfe2e8}
.ni .ni-card .ni-tw{background:var(--ni-paper);border-top:1px solid #dfe2e8}
.ni .ni-card[data-top] .ni-borde{display:none}
.ni .ni-card[data-top]{padding-bottom:0}
.ni .ni-card[data-top] .ni-tw{margin-bottom:0;border-radius:0 0 11px 11px;overflow:hidden}
.ni .ni-card[data-top] table.ni-mini tbody tr:last-child td{padding-bottom:9px}

/* ── cierre y packs ── */
.ni .ni-cierre{margin-top:56px;padding-top:36px;border-top:1px solid var(--ni-line-2)}
.ni .ni-cierre h3{font-size:clamp(26px,3.2vw,36px)}
.ni .ni-prox{font-size:13.5px;color:var(--ni-ink-soft);margin-top:10px;display:flex;align-items:center;gap:9px}
.ni .ni-prox b{color:var(--ni-ink);font-weight:600}
.ni .ni-dot{width:8px;height:8px;border-radius:50%;background:var(--ni-blue);flex:none;position:relative}
.ni .ni-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--ni-blue);animation:niAro 2.4s ease-out infinite}
@keyframes niAro{0%{transform:scale(1);opacity:.45}70%,100%{transform:scale(2.4);opacity:0}}
.ni .ni-packs{margin-top:72px;border:1.5px solid var(--ni-ink);border-radius:16px;padding:24px 28px 28px;background:var(--ni-paper)}
.ni .ni-packs .ni-ptit{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ni .ni-packs .ni-ptit h4{font-size:25px}
.ni .ni-packs .ni-ptit p{font-size:13px;color:var(--ni-ink-soft)}
.ni .ni-pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:20px;border-top:1px solid var(--ni-ink);padding-top:22px}
@media(max-width:900px){.ni .ni-pgrid{grid-template-columns:1fr;gap:22px}.ni .ni-pu+.ni-pu{border-left:0;padding-left:0;border-top:1px solid var(--ni-line-2);padding-top:22px}}
.ni .ni-pu{display:flex;flex-direction:column;gap:6px;padding-right:26px}
.ni .ni-pu+.ni-pu{border-left:1px solid var(--ni-ink);padding-left:26px}
.ni .ni-pu:last-child{padding-right:0}
.ni .ni-pu h4{font-size:22px;margin-top:2px}
.ni .ni-pu p{font-size:12.5px;color:var(--ni-ink-soft);line-height:1.5;max-width:44ch}
.ni .ni-precio{font-family:var(--ni-mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ni-ink);margin-top:4px}
.ni .ni-pu .ni-pl{margin-top:auto;padding-top:12px;font-family:var(--ni-mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ni-blue);text-decoration:none;white-space:nowrap;align-self:flex-start}
.ni .ni-pu .ni-pl:hover{text-decoration:underline}
.ni .ni-pu .ni-pl.negro{color:#fff;background:var(--ni-ink);border:1px solid var(--ni-ink);border-radius:9px;padding:10px 14px;margin-top:14px}
.ni .ni-pu .ni-pl.negro:hover{background:#2c2f3a;text-decoration:none}
.ni .ni-agenda{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--ni-line)}
.ni .ni-agenda .ok{width:18px;height:18px;border-radius:50%;background:var(--ni-green-soft);flex:none;position:relative}
.ni .ni-agenda .ok::after{content:'';position:absolute;left:6px;top:4px;width:4px;height:8px;border-right:1.8px solid var(--ni-green-ink);border-bottom:1.8px solid var(--ni-green-ink);transform:rotate(42deg)}
.ni .ni-agenda b{font-size:12.5px;font-weight:600;color:var(--ni-ink);display:block}
.ni .ni-agenda s{text-decoration:none;font-family:var(--ni-mono);font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--ni-mute);display:block;margin-top:2px}

/* ── zócalo ── */
.ni .ni-zocalo{border-top:1px solid var(--ni-line);padding:48px 0 42px;background:var(--ni-paper);text-align:center;margin-top:36px}
.ni .ni-ztop{font-family:var(--ni-serif);font-weight:500;font-size:clamp(22px,3vw,32px);letter-spacing:-.9px;line-height:1.2;color:var(--ni-ink);display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap}
/* 15-09 · el wordmark se mide en em para quedar a la altura del texto que lo rodea, no chiquito */
.ni .ni-zwm{display:inline-flex;align-items:center;color:var(--ni-ink);height:1.12em;width:auto;position:relative;top:.17em}
.ni .ni-zwm svg{height:100%;width:auto;aspect-ratio:409/100;display:block;flex:none}
.ni .ni-zsub{font-size:14.5px;color:var(--ni-ink-soft);line-height:1.6;max-width:64ch;margin:14px auto 0}
.ni .ni-zsub b{color:var(--ni-ink);font-weight:600}
.ni .ni-zrow{display:flex;flex-direction:column;align-items:center;gap:6px;border-top:1px solid var(--ni-line);padding-top:18px;margin-top:24px}
.ni .ni-znames{font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--ni-ink);line-height:1.9;max-width:74ch}
.ni .ni-znames.med{font-size:13px;font-weight:500;color:var(--ni-ink-soft)}
</style>

  var FLE = '<svg class="ni-fic ni-lat" viewBox="0 0 12 16" aria-hidden="true"><path d="M1.5 8.5 6 4l4.5 4.5"/><path d="M1.5 14 6 9.5l4.5 4.5"/></svg>';

  /* ═════════════════════════════════════════════════════════════════
     ADAPTADOR · el motor emite `listas`; acá se traduce a lo que se dibuja.
     Nada se inventa: lo que el payload no trae queda en null y se muestra un guión.
     ═════════════════════════════════════════════════════════════════ */
  /* ── Adaptador B · emisión de emit_tablero.py (TOPS / PIEZAS / JUGADAS / SEMANA, 10-09) ──
     Si datos.js trae `TOPS` en vez de `listas`, se traduce acá al mismo molde y el resto
     de la plantilla no se entera. Null del motor = ausente: se dibuja un guión, no se inventa. */
  if(!D.listas && D.TOPS){
    var listasB={}, canchasB={}, rotB={};
    Object.keys(D.TOPS).forEach(function(k){
      var Tq=D.TOPS[k]||{}, PZ=(D.PIEZAS||{})[k]||{};
      var key=(Tq.nombre||k)+' · '+(Tq.ambito||k);
      canchasB[k]=key; rotB[k]={nombre:Tq.nombre||('Top '+k), ambito:Tq.ambito||''};
      var usadas={};   // PIEZAS va por apellido: si dos filas lo comparten (Kirchner), la pieza es de la primera
      listasB[key]={ cancha:key, cuentas:Tq.cuentas, rankeables:Tq.total, filas:(Tq.filas||[]).map(function(r,i){
        var pz=(!usadas[r.n])?PZ[r.n]:null, dest=null;
        if(pz && pz.t){ usadas[r.n]=1; var mm=String(pz.m||'').split('·').map(function(s){return s.trim();});
          dest={ texto:pz.t, url:pz.u||'', red:mm[0]||'', fecha:mm[1]||'', comentarios:(parseInt(mm[2],10)||null), origen:pz.origen||'' }; }
        return { actor_id:r.actor_id, nombre:r.nombre, rol:r.rol, i:r.i, q:r.q, dv:r.dv, pos:i+1,
          d:(typeof r.d==='number'?r.d:(r.d==='='?0:null)), lw:(typeof r.lw==='number'?r.lw:null), pk:r.pk, sm:r.sm,
          f:(typeof r.f==='string'?r.f.split(','):(r.f||[])),
          estado:(r.i==null?(r.nota||'sin dato suficiente'):'ok'), destacada:dest, bruto:{}, foto:r.foto||null, you:r.you||0 };
      }) };
    });
    D.listas=listasB;
    if(!M.canchas) M.canchas=canchasB;
    if(!M.rotulos) M.rotulos=rotB;
    if(!M.actor_id){ Object.keys(listasB).forEach(function(key){ listasB[key].filas.forEach(function(r){ if(!M.actor_id && r.you) M.actor_id=r.actor_id; }); }); }
    var SW=D.SEMANA||{}, SWc=SW.calidad||{}, SWi=SW.influencia||{}, SWf=SW.funciono||{};
    if(!D.semana){ D.semana={
      piezas:(SW.piezas_medidas!=null?SW.piezas_medidas:SW.piezas), piezas_total:SW.piezas, base:SWi.base,
      serie_calidad:(SWc.serie||null), serie_gente:(SWi.serie||null),
      techo_v:(SWc.techo?SWc.techo.v:null), piso_v:(SWc.piso?SWc.piso.v:null),
      funciono:{ uno:SWf.uno||null, dos:SWf.dos||null, repetir:SWf.repetir||null },
      llamado:SW.llamado||null, origen:SWf.origen||'' }; }
    if(!M.proxima && SW.proxima) M.proxima=SW.proxima;
    if(M.semana==null && SW.semana!=null) M.semana=SW.semana;
  }

  /* si meta no trae canchas/rotulos, se deducen de las claves de `listas`:
     «Nacional» → nacional · contiene «provincial» → provincial · el resto → ciudad */
  var CANCHA = M.canchas, ROTULO = M.rotulos;
  if(!CANCHA){ CANCHA={}; Object.keys(D.listas||{}).forEach(function(key){
      var k=/nacional/i.test(key)?'nacional':/provincial/i.test(key)?'provincial':'ciudad'; if(!CANCHA[k]) CANCHA[k]=key; }); }
  if(!ROTULO){ ROTULO={}; Object.keys(CANCHA).forEach(function(k){ var key=CANCHA[k], amb=String(key).split('·').pop().trim();
      ROTULO[k]={nombre:k==='nacional'?'Top nacional':k==='provincial'?'Top provincial':'Top ciudad', ambito:amb}; }); }
  var YO = M.actor_id || '';
  function corto(nom){ var p=String(nom||'').trim().split(/\s+/); return p.length<=1?p[0]:p[p.length-1]; }
  function redondo(v,dec){ if(v==null) return null; var f=Math.pow(10,dec||0); return Math.round(v*f)/f; }
  function filaDe(r){
    var b=r.bruto||{}, mg=b.mediana_gente;

    var pl=(M.piezas||{})[r.actor_id], dest=r.destacada||null;
    if(pl && (pl.texto||pl.url)) dest={ texto:pl.texto||'', url:pl.url||'', red:'', fecha:'', comentarios:null, origen:'cargada por Lisandro' };
    return { id:r.actor_id, n:corto(r.nombre), largo:r.nombre, rol:r.rol,
      i:redondo(r.i,1), q:redondo(r.q,1), dv:redondo(r.dv,1),
      pe:(mg==null?null:(mg>=10?Math.round(mg):redondo(mg,1))),
      d:(typeof r.d==='number'?r.d:null), lw:(typeof r.lw==='number'?r.lw:null),

      dest:dest, serie:r.serie_i||[], sinDato:!!(r.estado&&r.estado!=='ok'), nota:(r.estado&&r.estado!=='ok'?r.estado:''), foto:r.foto||null };
  }
  /* ═══ LA MIRADA DE LISANDRO · lo que el motor no mide. Todo opcional y todo en `meta`. ═══
     · meta.ponderacion[actor_id] = 1 bajo · 2 bueno · 3 muy bueno → pesa la calidad ×0,85 / ×1 / ×1,15
       (meta.ponderacion_factor pisa esos tres).
     · piso de influencia: quien publicó nunca computa influencia por debajo de 1, así publicar con
       calidad y sin respuesta no vale lo mismo que no publicar (meta.piso_influencia; 0 lo apaga).
       PROVISORIO: es regla del motor, confirmada el 10-09. Cuando NarraNoise la emita, se saca de acá.
     Las dos recalculan el índice —i = sqrt(calidad × influencia)— y reordenan la lista. */
  var POND=M.ponderacion||{}, PF=M.ponderacion_factor||{1:0.85,2:1,3:1.15};
  var PISO=(M.piso_influencia!=null?M.piso_influencia:1);
  function mirada(filas){
    var tocado=false;
    filas.forEach(function(r){
      var w=POND[r.id];
      if(w && PF[w]!=null && r.q!=null){ r.qm=r.q; r.q=redondo(r.q*PF[w],1); r.pond=w; tocado=true; }
      if(PISO && r.i===0 && r.q>0){ r.dv=Math.max(r.dv||0,PISO); r.piso=1; tocado=true; }
      if((r.pond||r.piso) && r.q!=null && r.dv!=null) r.i=redondo(Math.sqrt(r.q*r.dv),1);
    });
    return tocado;
  }
  var TOPS={}, YO_FILA=null;
  ['ciudad','provincial','nacional'].forEach(function(k){
    var L=(D.listas||{})[CANCHA[k]]; if(!L) return;
    var filas=(L.filas||[]).map(filaDe);
    var tocado=mirada(filas);
    /* orden: el del motor mientras la mirada no mueva ningún índice; si lo movió, se reordena por índice */
    filas.sort(function(a,b){ if(!tocado && a.pos!=null && b.pos!=null) return a.pos-b.pos;
      var ai=(a.i==null?-1:a.i), bi=(b.i==null?-1:b.i); return bi-ai || (a.pos||0)-(b.pos||0) || String(a.n).localeCompare(String(b.n),'es'); });
    filas.forEach(function(r,i){ r.pos=i+1; });
    TOPS[k]={ nombre:ROTULO[k].nombre, ambito:ROTULO[k].ambito, total:L.rankeables||filas.length, cuentas:L.cuentas||filas.length, filas:filas };
    filas.forEach(function(r){ if(r.you && !YO_FILA) YO_FILA=r; });
  });

  var hue=function(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h;};
  var ini=function(n){return String(n||'').split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();};
  /* El álbum acepta webp, jpeg y png, así que la cara se busca en ese orden y
     recién al agotarlo caen las iniciales. Va encadenado por onerror y no en
     paralelo: la foto que está (hoy las 239 son webp) cuesta un solo pedido, y
     sólo la que falta paga los intentos de más. */
  var EXT_FOTO=['webp','jpg','jpeg','png'];
  window.NARRA_AV_ERR=function(img){
    var base=img.getAttribute('data-base')||'';
    var resto=(img.getAttribute('data-ext')||'').split(',').filter(function(e){return e;});
    if(base && resto.length){ img.setAttribute('data-ext',resto.slice(1).join(',')); img.src=base+'.'+resto[0]; return; }
    img.replaceWith(document.createTextNode(img.getAttribute('data-ini')||''));
  };
  function av(r,size){
    var nm=r.you?(M.iniciales||ini(r.n)):ini(r.n);
    var FOTOS=window.NARRA_FOTOS_BASE||'';          // álbum único; si no está, manda lo que traiga datos.js
    var base=(FOTOS&&r.id)?FOTOS+encodeURIComponent(r.id):'';
    var src=base?base+'.'+EXT_FOTO[0]:r.foto;
    var dentro=src?'<img src="'+esc(src)+'" alt="" loading="lazy" data-ini="'+esc(nm)+'" data-base="'+esc(base)+'" data-ext="'+EXT_FOTO.slice(1).join(',')+'" onerror="NARRA_AV_ERR(this)">':esc(nm);
    return '<span class="ni-av'+(r.you?' you':'')+'" style="--h:hsl('+hue(r.n||'')+' 32% 44%);--s:'+size+'px" title="'+esc(r.largo||r.n)+'">'+dentro+'</span>';
  }
  function forma(f){ return '<span class="ni-form" aria-hidden="true">'+(f||[]).map(function(c){return '<i class="'+esc(c||'')+'"></i>';}).join('')+'</span>'; }
  function velas(Tp){
    var max=6;
    return '<span class="ni-velas" role="img" aria-label="movimientos de la semana en '+esc(Tp.ambito)+'">'+Tp.filas.map(function(r){
      var d=(typeof r.d==='number')?r.d:0;
      if(d===0) return '<i class="'+(r.you?'yo':'')+'"></i>';
      var h=Math.max(8,Math.round(Math.min(Math.abs(d),max)/max*26));
      return '<i class="'+(d>0?'up':'dn')+(Math.abs(d)<3?' chico':'')+(r.you?' yo':'')+'" style="--h:'+h+'px"></i>';
    }).join('')+'</span>';
  }
  function movimientos(Tp){                  // hasta cuatro, sólo sobre el top 10
    var top=Tp.filas.slice(0,10).map(function(r){return {r:r,d:(typeof r.d==='number'?r.d:0)};});
    var suben=top.filter(function(x){return x.d>0;}).sort(function(a,b){return b.d-a.d;}).slice(0,2);
    var caen =top.filter(function(x){return x.d<0;}).sort(function(a,b){return a.d-b.d;}).slice(0,2);
    var ev=suben.map(function(x){return [1,x.r];}).concat(caen.map(function(x){return [-1,x.r];}));
    if(!ev.length) return '<span class="ni-mov quieto">sin movimientos en el top 10</span>';
    return ev.map(function(t){ return '<span class="ni-mov '+(t[0]>0?'up':'dn')+'">'+(t[0]>0?FLE:FLEd)+'<b>'+esc(t[1].you?'Vos':t[1].n)+'</b></span>'; }).join('');
  }
  /* ═══ EL PULSO DE OCHO SEMANAS DE LA LISTA (11-09) ═══
     Sale de `f`, la forma de ocho semanas que ya emite el motor por actor.
     · clima: cuántos suben, quedan quietos o bajan en cada semana de la lista entera.
     · vector neutral activado: venía plano cinco semanas y se movió en las últimas tres.
     · racha: tres o más semanas seguidas subiendo; si llega a hoy, sigue abierta.
     La semana 1 no tiene base contra qué compararse: no se dibuja. */
  function pulso(Tp){
    var W=8, clima=[], act=[], rac=[];
    for(var i=0;i<W;i++) clima.push({up:0,dn:0,fl:0,n:0});
    (Tp.filas||[]).forEach(function(r){
      var f=r.f||[]; if(f.length<W) return;
      f.forEach(function(c,i){ if(clima[i][c]!=null){ clima[i][c]++; clima[i].n++; } });
      var todoPlano=f.every(function(c){return c==='fl';});
      var quieto=f.slice(0,5).every(function(c){return c==='fl';});
      var movs=f.slice(5).filter(function(c){return c!=='fl';}).length;
      var sube=f.slice(5).filter(function(c){return c==='up';}).length;
      if(!todoPlano && quieto && movs>0) act.push({r:r,sube:sube,movs:movs});
      var run=0,best=0,cola=0;
      f.forEach(function(c){ if(c==='up'){ run++; if(run>best) best=run; } else run=0; });
      for(var j=f.length-1;j>=0;j--){ if(f[j]==='up') cola++; else break; }
      if(best>=3) rac.push({r:r,best:best,cola:cola});
    });
    act.sort(function(a,b){ return b.sube-a.sube || b.movs-a.movs; });
    rac.sort(function(a,b){ return b.cola-a.cola || b.best-a.best; });
    return { clima:clima.slice(1), act:act, rac:rac };
  }
  function nom(r){ return esc(r.you?'Vos':r.n); }
  function pulsoLinea(P){
    var t=[];
    if(P.act.length) t.push('<b>'+P.act.length+'</b> '+(P.act.length===1?'vector neutral se activó':'vectores neutrales se activaron'));
    var top=null;
    P.rac.forEach(function(x){ if(!top && x.cola>=3) top=x; });
    if(!top) top=P.rac[0]||null;
    if(top) t.push(top.cola>=3 ? '<b>'+nom(top.r)+'</b> sube hace '+top.cola+' semanas'
                               : '<b>'+nom(top.r)+'</b> encadenó '+top.best+' semanas en alza');
    if(!t.length) t.push('sin picos ni vectores nuevos en ocho semanas');
    return '<p class="ni-pulso">'+t.join(' <span class="ni-sp">·</span> ')+'</p>';
  }
  function pulsoPanel(P,Tp){
    var mx=1; P.clima.forEach(function(c){ if(c.n>mx) mx=c.n; });
    var alto=function(v){ return v?Math.max(2,Math.round(v/mx*30)):0; };
    var barras=P.clima.map(function(c){
      return '<span class="cw" title="'+c.up+' suben · '+c.fl+' quietos · '+c.dn+' bajan">'+
        (c.up?'<i class="up" style="height:'+alto(c.up)+'px"></i>':'')+
        (c.fl?'<i class="fl" style="height:'+alto(c.fl)+'px"></i>':'')+
        (c.dn?'<i class="dn" style="height:'+alto(c.dn)+'px"></i>':'')+'</span>';
    }).join('');
    var hall='';
    if(P.act.length) hall+='<p><s class="nu">Se activó</s><span>'+P.act.slice(0,4).map(function(x){return '<b>'+nom(x.r)+'</b>';}).join(' · ')+
      ' — '+(P.act.length===1?'venía plano':'venían planos')+' cinco semanas y se '+(P.act.length===1?'movió':'movieron')+' en las últimas tres.</span></p>';
    if(P.rac.length) hall+='<p><s class="up">Racha</s><span>'+P.rac.slice(0,4).map(function(x){return '<b>'+nom(x.r)+'</b> '+x.best+(x.cola>=3?' (sigue)':'');}).join(' · ')+
      ' — semanas seguidas subiendo dentro de la ventana.</span></p>';
    if(!hall) hall='<p><s>Sin picos</s><span>Nadie encadenó tres semanas en alza ni salió de una racha plana.</span></p>';
    return '<div class="ni-pulsobox"><span class="ni-k">El pulso de '+esc(Tp.ambito)+' · ocho semanas</span>'+
      '<div class="ni-clima" role="img" aria-label="clima semanal de la lista de '+esc(Tp.ambito)+'">'+barras+'</div>'+
      '<div class="ni-ejes"><span>hace 7 semanas</span><span>verde sube · gris quieto · rosa baja</span><span>hoy</span></div>'+
      '<div class="ni-hall">'+hall+'</div></div>';
  }

  /* qué funcionó en la cancha: manda meta.funciono[cancha] si viene; si no, la mejor pieza destacada del top */
  /* links extra por actor que carga Lisandro (meta.piezas_extra[actor_id] = [url, …]); van después de la pieza del motor */
  var EXTRA=M.piezas_extra||{};
  function extras(r,desde){ var u=EXTRA[r.id]||[]; desde=desde||2; return u.map(function(x,i){ var n=desde+i; return ' <a class="ni-vp" href="'+esc(x)+'" target="_blank" rel="noopener">'+esc(n>1?T.ver_pieza.replace('→',n+' →'):T.ver_pieza)+'</a>'; }).join(''); }
  var SIN_PIEZA=M.sin_pieza||[];   // actores cuya pieza no se muestra (ni en la card ni en la tabla)
  function muestraPieza(r){ return !!(r.dest && r.dest.texto) && SIN_PIEZA.indexOf(r.id)<0; }
  function destacadaDe(k,Tp){
    var pref=(M.funciono||{})[k];
    var fila=null;
    if(pref && pref.actor_id) Tp.filas.forEach(function(r){ if(r.id===pref.actor_id) fila=r; });
    if(!fila){ var con=Tp.filas.filter(muestraPieza); con.sort(function(a,b){return (b.dest.comentarios||0)-(a.dest.comentarios||0);}); fila=con[0]||null; }
    if(!fila) return null;
    return { fila:fila, t:(pref&&pref.titulo)||fila.dest.texto, url:fila.dest.url||'#', porque:(pref&&pref.porque)||'' };
  }
  function geo(k){ var g=(D.GEO||{})[k]; return g?'<svg class="ni-geo" viewBox="'+esc(g.vb)+'" aria-hidden="true" focusable="false"><path d="'+esc(g.d)+'"/></svg>':''; }
  /* 15-09: la silueta deja de ser marca de agua y pasa a ser un ícono al lado del ámbito, a la altura del rótulo */
  function geoIcono(k){ var g=(D.GEO||{})[k]; return g?'<svg class="ni-geoi" viewBox="'+esc(g.vb)+'" aria-hidden="true" focusable="false"><path d="'+esc(g.d)+'"/></svg>':''; }
  /* una línea: sin saltos, sin caracteres invisibles, las negritas unicode (𝗤𝘂𝗲́) vueltas a letras y sin emojis al frente */
  function unaLinea(s){ s=String(s||''); try{ s=s.normalize('NFKC'); }catch(e){}
    s=s.replace(/[\u200b-\u200f\ufeff]/g,'').replace(/\s*\n+\s*/g,' ').replace(/\s+/g,' ').trim();

  /* recorte para titular: el motor manda el copy cortado a 120 caracteres. Si entra y cierra
     con puntuación, va entero; si no, hasta la última oración completa o hasta la última palabra + … */
  function recorte(s,max){
    s=unaLinea(s); max=max||90;
    if(s.length<=max && /[.!?…»"”]$/.test(s)) return s;
    var head=s.slice(0,max), m=head.search(/[.!?](?=\s)[^.!?]*$/);
    if(m>max*0.35) return head.slice(0,m+1);
    var sp=head.lastIndexOf(' '); return (sp>max*0.5?head.slice(0,sp):head).replace(/[,;:\s]+$/,'')+'…';
  }

  /* 15-09 · el titular entra en dos renglones: la cita se achica según lo que ocupe la frase que mide */
  function citaPara(texto,frase){

  /* 15-09 · la cita del titular se corta siempre al mismo largo y cierra sin puntos suspensivos */

  /* la curva de calidad: la línea es tu promedio semana a semana (ventana de 4); a la derecha, hoy:

  function lineaCalidad(pz){

    var X=function(i){return 6+i*(236/(n-1));}, Y=function(v){return 76-((v-mn)/(mx-mn))*70;};

    var xh=X(n-1), yh=Y(s[n-1]), lx=xh.toFixed(1), out='';

      pie: agendado ? '<div class="ni-agenda"><span class="ok" aria-hidden="true"></span><span><b>'+esc(L.fecha)+(L.hora?' · '+esc(L.hora):'')+'</b><s>'+esc(L.dura||'Media hora')+'</s></span></div>'
                    : (M.agenda_url?'<a class="ni-pl negro" href="'+esc(M.agenda_url)+'" target="_blank" rel="noopener">'+esc(T.agendar)+' →</a>':'<span class="ni-agenda"><span><b>Sin fecha todavía</b><s>falta el link de agenda</s></span></span>') },
    { k:T.no_incluido+' · jornada con tu equipo', h:P.taller_t||'Taller al equipo', p:P.taller_p||'Del dato al contenido. Una jornada de entrenamiento al equipo de comunicación y monitoreo técnico de su producción.', precio:P.taller_precio||'',
      pie:'<a class="ni-pl" href="'+wa(P.taller_t||'Taller al equipo')+'" target="_blank" rel="noopener">'+esc(T.consultar)+'</a>' },
    { k:T.no_incluido+' · encuentro mensual', h:P.mesa_t||'Mesa chica', p:P.mesa_p||'Del dato a la toma de decisión. Para escenarios de alta incidencia (campaña, lanzamiento, crisis). Monitoreo de adversarios, ataques recibidos y respuestas.', precio:P.mesa_precio||'',
      pie:'<a class="ni-pl" href="'+wa(P.mesa_t||'Mesa chica')+'" target="_blank" rel="noopener">'+esc(T.consultar)+'</a>' }
  ];
  setH('ni-pgrid', packs.map(function(p){ return '<div class="ni-pu"><span class="ni-k">'+esc(p.k)+'</span><h4>'+esc(p.h)+'</h4><p>'+esc(p.p)+'</p>'+(p.precio?'<span class="ni-precio">'+esc(p.precio)+'</span>':'')+p.pie+'</div>'; }).join(''));

  /* ═══ ZÓCALO ═══ */
  var Z=M.familia||{};
  setH('ni-ztop', esc(T.z_top)+' <span class="ni-zwm"><svg viewBox="4 6 409 100" role="img" aria-label="narraglobal" preserveAspectRatio="xMinYMid meet"><use href="#ni-wordmark" xlink:href="#ni-wordmark"/></svg></span>'+esc(T.z_top2));
  setH('ni-zsub', T.z_sub);
  var confian=Z.confian||['Google','HBO Max','Bayer','Syngenta','Amgen','L’Oréal','BID','Volkswagen','Accenture','River Plate'];
  var publican=Z.publican||['CNN','Forbes','Univisión','TVE','Infobae','Telefe','Clarín','La Nación','TN'];
  setH('ni-zrows','<div class="ni-zrow"><span class="ni-k">'+esc(T.z_confian)+'</span><span class="ni-znames">'+confian.map(esc).join(' · ')+'</span></div><div class="ni-zrow"><span class="ni-k">'+esc(T.z_publican)+'</span><span class="ni-znames med">'+publican.map(esc).join(' · ')+'</span></div>');

  /* ═══ INTERACCIÓN · un solo listener, todo colapsado al abrir ═══ */
  ROOT.addEventListener('click',function(ev){
    var tg=ev.target.closest('button.ni-tog');
    if(tg){ var sec=$(tg.getAttribute('aria-controls')); if(!sec) return; var ab=tg.getAttribute('aria-expanded')==='true'; sec.hidden=ab; tg.setAttribute('aria-expanded',String(!ab)); tg.classList.toggle('plegado',ab); return; }
    var pie=ev.target.closest('button.ni-pie');
    if(pie){ var det=$(pie.getAttribute('aria-controls')); if(!det) return; var op=pie.getAttribute('aria-expanded')==='true'; det.hidden=op; pie.setAttribute('aria-expanded',String(!op)); var b=pie.querySelector('.ni-btn'); if(b) b.textContent=op?(det.classList.contains('ni-det')&&pie.closest('[data-top]')?T.ver_tabla:T.ver_detalle):T.ocultar; return; }
    var vm=ev.target.closest('button.ni-vermas');
    if(vm){ var w=vm.closest('.ni-det'), op2=vm.getAttribute('aria-expanded')==='true'; w.querySelectorAll('tr.resto').forEach(function(tr){tr.hidden=op2;}); vm.setAttribute('aria-expanded',String(!op2)); var n=w.querySelectorAll('tr.resto').length+6; vm.textContent=op2?('Ver las '+n+' ›'):'Ver sólo el top 6 ‹'; return; }
    var pl=ev.target.closest('button.ni-play');
    if(pl){ var tr=pl.closest('tr'), fila=tr&&tr.nextElementSibling; if(fila&&fila.classList.contains('pz')){ var op3=!fila.hidden; fila.hidden=op3; pl.classList.toggle('on',!op3); pl.setAttribute('aria-expanded',String(!op3)); } return; }
  });
  /* menú: marca la sección visible */
  (function(){
    var links=[].slice.call(ROOT.querySelectorAll('.ni-menu a'));
    var secs=links.map(function(a){return document.querySelector(a.getAttribute('href'));});
    function marca(){ var y=window.scrollY+120,i=0; secs.forEach(function(s,k){ if(s&&s.offsetTop<=y) i=k; }); links.forEach(function(a,k){a.classList.toggle('on',k===i);}); }
    window.addEventListener('scroll',marca,{passive:true}); marca();
  })();
})();
</script>
